{{- if $.Values.prometheusRule }}
{{- if and ( .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" ) ( .Values.prometheusRule.enabled ) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
{{- if .Values.prometheusRule.labels }}
  labels:
{{ toYaml .Values.prometheusRule.labels | indent 4}}
{{- end }}
  name: {{ template "github-actions-exporter.fullname" . }}
{{- if .Values.prometheusRule.namespace }}
  namespace: {{ .Values.prometheusRule.namespace }}
{{- end }}
spec:
  groups:
  - name: github-actions-exporter.runners
    rules:
    - alert: GithubRunnerDown
      expr: |-
        github_runner_status == 0
        or github_runner_organization_status == 0
        or github_runner_enterprise_status == 0
      for: {{ .Values.prometheusRule.runnerDown.for | default "5m" }}
      labels:
        severity: {{ .Values.prometheusRule.runnerDown.severity | default "critical" }}
      annotations:
        summary: "GitHub self-hosted runner {{`{{ $labels.name }}`}} is offline"
        description: >-
          Runner {{`{{ $labels.name }}`}} (id {{`{{ $labels.id }}`}}) scoped to
          {{`{{ or $labels.repo $labels.organization "the enterprise" }}`}} has
          reported offline for more than {{ .Values.prometheusRule.runnerDown.for | default "5m" }}.
{{- end }}
{{- end }}
