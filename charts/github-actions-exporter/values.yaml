# Default values for github-actions-exporter.

image:
  repository: 471112653798.dkr.ecr.eu-central-1.amazonaws.com/github-exporter
  pullPolicy: IfNotPresent
  tag: "v1.0.3"

nameOverride: ""
fullnameOverride: ""

env:
  PORT: 9999
  GITHUB_REFRESH: 30
  GITHUB_API_URL: api.github.com
  GITHUB_ORGAS: ""
  GITHUB_REPOS: ""
  # ENTERPRISE_NAME: ""
  # EXPORT_FIELDS: "repo,id,node_id,head_branch,head_sha,run_number,run_attempt,workflow_id,workflow,event,status"
  # FETCH_WORKFLOW_RUN_USAGE: "true"
  # FETCH_JOB_METRICS: "false"
  # WORKFLOW_RUN_WINDOW_HOURS: "12"
  # GITHUB_WORKFLOWS: ""          # Comma-separated workflow names to monitor (empty = all)
  # GITHUB_WORKFLOW_JOBS: ""      # Comma-separated job names to monitor (empty = all)

# Secret containing GitHub credentials.
# Expects keys: github_token (for PAT auth) or github_app_id,
# github_app_installation_id, github_app_private_key (for App auth).
secret:
  name: "actions-exporter"

serviceMonitor:
  enabled: yes
  labels:
    release: prometheus
  interval: 30s
  # namespace: monitoring
  # timeout: 10s
  # targetLabels: []
  # metricRelabelings: []

imagePullSecrets: []

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 9999

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
