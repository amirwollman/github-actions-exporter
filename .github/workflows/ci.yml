# Builds and tests every pull request, including the image, so a broken
# Dockerfile or certificate check fails here rather than on a release tag.
# release.yml also calls it, so nothing is published from a commit that fails.
name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The same toolchain release.yml ships with: the newest 1.27 patch.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: go.mod is tidy
        run: go mod tidy -diff

      - run: go vet ./...
      - run: go test -race ./...

      - name: Certificate check accepts a clean root and flags every distrusted key
        run: |
          set -uo pipefail
          sh scripts/check-distrusted-certs.sh scripts/testdata/isrg-root-x1.pem || {
            echo "::error::check rejected ISRG Root X1"
            exit 1
          }
          rc=0
          out="$(sh scripts/check-distrusted-certs.sh scripts/testdata/distrusted.pem 2>&1)" || rc=$?
          echo "$out"
          # Exit 1 with a match for each of the 22 certificates (14 distinct
          # keys), not any failure: a missing fixture or a broken openssl also
          # exits non-zero, and a mistyped hash would drop its certificates.
          hits="$(grep -c '^distrusted certificate still present: ' <<<"$out" || true)"
          keys="$(grep '^distrusted certificate still present: ' <<<"$out" | sort -u | wc -l)"
          if [ "$rc" -ne 1 ] || [ "$hits" -ne 22 ] || [ "$keys" -ne 14 ]; then
            echo "::error::expected exit 1 with 22 matches over 14 keys, got exit $rc, $hits matches, $keys keys"
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: github-actions-exporter:ci
          build-args: VERSION=${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id github-actions-exporter:ci -u | grep -qx 65534
          docker run --rm github-actions-exporter:ci ./app --version | grep -F '${{ github.sha }}'

      # The image's builder is digest-pinned and can lag the newest Go patch,
      # so scan the binary that actually ships rather than trust the test job.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - name: govulncheck the shipped binary
        run: |
          set -euo pipefail
          id="$(docker create github-actions-exporter:ci)"
          docker cp "$id:/app" "$RUNNER_TEMP/app"
          docker rm "$id"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/app"
