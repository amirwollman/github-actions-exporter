# Builds and tests every pull request, including the image, so a broken
# Dockerfile or certificate check fails here rather than on a release tag.
# release.yml also calls it, so nothing is published from a commit that fails.
name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Runner's bundled Node has the Brotli fix
        run: sh scripts/check-runner-node.sh

      # The same toolchain release.yml ships with: the newest 1.27 patch.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: go.mod is tidy
        run: go mod tidy -diff

      - run: go vet ./...
      # -count=1: a cache restored from main must not stand in for a test run
      # on the release gate.
      - run: go test -race -count=1 ./...

      - name: Certificate check accepts a clean root and flags every distrusted key
        run: sh scripts/test-check-distrusted-certs.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: github-actions-exporter:ci
          build-args: VERSION=${{ github.sha }}

      # The check gates the image under busybox, so test it there too, in the
      # release stage's own base image, read from the Dockerfile so the two
      # can't drift apart when Dependabot bumps it.
      - name: Certificate check under Alpine busybox
        run: |
          set -euo pipefail
          base="$(sed -n 's/^FROM \([^ ]*\) AS release$/\1/p' Dockerfile)"
          test -n "$base"
          echo "release base: $base"
          docker run --rm -v "$PWD/scripts:/scripts:ro" "$base" \
            sh -c 'apk add --no-cache openssl >/dev/null && sh /scripts/test-check-distrusted-certs.sh'

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id github-actions-exporter:ci -u | grep -qx 65534
          docker run --rm github-actions-exporter:ci ./app --version | grep -F '${{ github.sha }}'

      # The image's builder is digest-pinned and can lag the newest Go patch,
      # so scan the binary that actually ships rather than trust the test job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - name: govulncheck the shipped binary
        run: |
          set -euo pipefail
          id="$(docker create github-actions-exporter:ci)"
          docker cp "$id:/app" "$RUNNER_TEMP/app"
          docker rm "$id"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/app"
