# Builds and tests every pull request, including the image, so a broken
# Dockerfile or certificate check fails here rather than on a release tag.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go vet ./...
      - run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: github-actions-exporter:ci

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id github-actions-exporter:ci -u | grep -qx 65534
          docker run --rm github-actions-exporter:ci ./app --version
