name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  APP_NAME: github-actions-exporter
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: nowsprinting/check-version-format-action@v3
        if: github.event_name != 'pull_request'
        id: version
        with:
          prefix: "v"

      - name: Build app
        run: CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-X 'main.version=${{ steps.version.outputs.full }}'" -o bin/${{ env.APP_NAME }} .

      - name: Generate MD5
        run: md5sum bin/${{ env.APP_NAME }} > bin/${{ env.APP_NAME }}.md5

      - name: Push to release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            bin/${{ env.APP_NAME }}
            bin/${{ env.APP_NAME }}.md5
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Helm chart versions
        run: |
          APP_VERSION="${{ steps.version.outputs.full }}"
          APP_VERSION="${APP_VERSION#v}"
          CHART_DIR="charts/github-actions-exporter"

          git fetch origin main
          git checkout main

          sed -i "s/^version:.*/version: ${APP_VERSION}/" ${CHART_DIR}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${APP_VERSION}/" ${CHART_DIR}/Chart.yaml
          sed -i 's/  tag: .*/  tag: "'"${APP_VERSION}"'"/' ${CHART_DIR}/values.yaml

          echo "==============================="
          echo "Chart version: ${APP_VERSION}"
          echo "App version:   ${APP_VERSION}"
          echo "Image tag:     ${APP_VERSION}"
          echo "==============================="
          echo ""
          echo "--- Chart.yaml ---"
          cat ${CHART_DIR}/Chart.yaml
          echo ""
          echo "--- values.yaml (image section) ---"
          head -8 ${CHART_DIR}/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          git diff --cached --quiet || (git commit -m "chore: bump chart to v${APP_VERSION}" && git push origin main)

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Publish Helm chart to gh-pages
        run: |
          APP_VERSION="${{ steps.version.outputs.full }}"
          APP_VERSION="${APP_VERSION#v}"
          CHART_DIR="charts/github-actions-exporter"

          git fetch origin gh-pages || git checkout --orphan gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          helm package "${CHART_DIR}" -d /tmp/gh-pages
          touch /tmp/gh-pages/.nojekyll
          helm repo index /tmp/gh-pages --url https://amirwollman.github.io/github-actions-exporter/

          cd /tmp/gh-pages
          git add .
          git diff --cached --quiet || (git commit -m "chart: publish v${APP_VERSION}" && git push origin HEAD:gh-pages)

          echo "==============================="
          echo "Chart v${APP_VERSION} published to gh-pages"
          echo "==============================="
