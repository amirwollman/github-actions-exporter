# Releases the container image only. The chart is released separately by
# chart_release.yaml on a chart-v* tag, so a new image is not deployed until
# a chart release deliberately adopts it (values.yaml image.tag), and a chart
# can be re-released without building a new image.
name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  APP_NAME: github-actions-exporter
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: nowsprinting/check-version-format-action@v3
        if: github.event_name != 'pull_request'
        id: version
        with:
          prefix: "v"

      - name: Build app
        run: CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-X 'main.version=${{ steps.version.outputs.full }}'" -o bin/${{ env.APP_NAME }} .

      - name: Generate MD5
        run: md5sum bin/${{ env.APP_NAME }} > bin/${{ env.APP_NAME }}.md5

      - name: Push to release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            bin/${{ env.APP_NAME }}
            bin/${{ env.APP_NAME }}.md5
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
