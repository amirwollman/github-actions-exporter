name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: 471112653798.dkr.ecr.eu-central-1.amazonaws.com
  IMAGE: github-exporter
  APP_NAME: github-actions-exporter

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v3
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: nowsprinting/check-version-format-action@v3
        if: github.event_name != 'pull_request'
        id: version
        with:
          prefix: "v"

      - name: Build app
        run: CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-X 'main.version=${{ steps.version.outputs.full }}'" -o bin/${{ env.APP_NAME }} .

      - name: Generate MD5
        run: md5sum bin/${{ env.APP_NAME }} > bin/${{ env.APP_NAME }}.md5

      - name: Push to release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            bin/${{ env.APP_NAME }}
            bin/${{ env.APP_NAME }}.md5
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - id: context
        uses: bold-dev/bold-action-context@main
        with:
          account: dev
          role: github-github-exporter

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ steps.context.outputs.region }}
          role-to-assume: ${{ steps.context.outputs.role-arn }}

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Helm chart versions
        run: |
          APP_VERSION="${{ steps.version.outputs.full }}"
          APP_VERSION="${APP_VERSION#v}"
          CHART_DIR="charts/github-actions-exporter"

          git fetch origin main
          git checkout main

          sed -i "s/^version:.*/version: ${APP_VERSION}/" ${CHART_DIR}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${APP_VERSION}/" ${CHART_DIR}/Chart.yaml
          sed -i 's/  tag: .*/  tag: "'"${APP_VERSION}"'"/' ${CHART_DIR}/values.yaml

          echo "==============================="
          echo "Chart version: ${APP_VERSION}"
          echo "App version:   ${APP_VERSION}"
          echo "Image tag:     ${APP_VERSION}"
          echo "==============================="
          echo ""
          echo "--- Chart.yaml ---"
          cat ${CHART_DIR}/Chart.yaml
          echo ""
          echo "--- values.yaml (image section) ---"
          head -8 ${CHART_DIR}/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/
          git diff --cached --quiet || (git commit -m "chore: bump chart to v${APP_VERSION}" && git push origin main)

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Publish Helm chart to ECR (OCI)
        run: |
          APP_VERSION="${{ steps.version.outputs.full }}"
          APP_VERSION="${APP_VERSION#v}"
          CHART_DIR="charts/github-actions-exporter"

          aws ecr describe-repositories --repository-names github-actions-exporter-chart 2>/dev/null || \
            aws ecr create-repository --repository-name github-actions-exporter-chart

          aws ecr get-login-password --region ${{ steps.context.outputs.region }} | \
            helm registry login --username AWS --password-stdin ${{ env.REGISTRY }}

          helm package "${CHART_DIR}" -d /tmp
          helm push /tmp/github-actions-exporter-${APP_VERSION}.tgz oci://${{ env.REGISTRY }}

          echo "==============================="
          echo "Chart v${APP_VERSION} pushed to oci://${{ env.REGISTRY }}/github-actions-exporter"
          echo "==============================="
