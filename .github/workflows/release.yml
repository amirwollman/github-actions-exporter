# Releases the container image only. The chart is released separately by
# chart_release.yaml on a chart-v* tag, so a new image is not deployed until
# a chart release deliberately adopts it (values.yaml image.tag), and a chart
# can be re-released without building a new image.
name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  APP_NAME: github-actions-exporter
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      # Newest 1.27 patch rather than go.mod's minimum, so the release binary
      # picks up stdlib security fixes without waiting for a go.mod bump.
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - uses: nowsprinting/check-version-format-action@22aede0d4fcf61035e89d0682f36ca917a277505 # v3.2.10
        if: github.event_name != 'pull_request'
        id: version
        with:
          prefix: "v"

      - name: Build app
        run: CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-X 'main.version=${{ steps.version.outputs.full }}'" -o bin/${{ env.APP_NAME }} .

      - name: Generate MD5
        run: md5sum bin/${{ env.APP_NAME }} > bin/${{ env.APP_NAME }}.md5

      - name: Push to release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            bin/${{ env.APP_NAME }}
            bin/${{ env.APP_NAME }}.md5
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
