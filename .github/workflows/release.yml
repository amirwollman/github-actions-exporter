# Releases the container image only. The chart is released separately by
# chart_release.yaml on a chart-v* tag, so a new image is not deployed until
# a chart release deliberately adopts it (values.yaml image.tag), and a chart
# can be re-released without building a new image.
name: Release Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: github-actions-exporter
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # This job holds the write tokens and may land on a different runner
      # version than the CI jobs, so check its own VM.
      - name: Runner's bundled Node has the Brotli fix
        run: sh scripts/check-runner-node.sh

      # Newest 1.27 patch rather than go.mod's minimum, so the release binary
      # picks up stdlib security fixes without waiting for a go.mod bump.
      # No dependency cache in the job that holds write tokens: Go trusts
      # what's already in GOMODCACHE, so a poisoned cache would ship.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false

      - uses: nowsprinting/check-version-format-action@22aede0d4fcf61035e89d0682f36ca917a277505 # v3.2.10
        id: version
        with:
          prefix: "v"

      # The action only reports validity. Stop here, before anything is pushed
      # as latest or released without a real version.
      - name: Require a semver tag
        if: steps.version.outputs.is_valid != 'true'
        # Through env, not ${{ }} in the script: a tag that fails this check
        # can contain shell syntax.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "::error::tag '${TAG}' is not a valid v<semver> version"
          exit 1

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.full }}
        run: CGO_ENABLED=0 GOOS=linux go build -a -ldflags="-X 'main.version=${VERSION}'" -o "bin/${APP_NAME}" .

      # Registries refuse uppercase names; github.repository may have them.
      - name: Image name
        id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == '' }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and check the image locally first, then push. The push reuses
      # this build's layers from the same builder (verified before any tag
      # moves), so what ships is what was checked here, not CI's build.
      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: release-candidate
          build-args: VERSION=${{ steps.version.outputs.full }}

      - name: Check the image
        env:
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint id release-candidate -u | grep -qx 65534
          docker run --rm release-candidate ./app --version | grep -F -- "$VERSION"
          id="$(docker create release-candidate)"
          docker cp "$id:/app" "$RUNNER_TEMP/app"
          docker rm "$id"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/app"

      # Push by digest only, no tags: nothing public moves until the pushed
      # image is proven to be the checked one.
      - name: Push Docker image by digest
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.full }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      # The push should be a cache hit on the checked build. A silent rebuild
      # would ship layers nothing above looked at, so compare before tagging.
      - name: Pushed image is the checked image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          image: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker pull "${image}@${DIGEST}"
          pushed="$(docker image inspect "${image}@${DIGEST}" --format '{{json .RootFS.Layers}}')"
          checked="$(docker image inspect release-candidate --format '{{json .RootFS.Layers}}')"
          if [ "$pushed" != "$checked" ]; then
            echo "::error::pushed image ${DIGEST} has different layers from the checked build; no tags were moved"
            echo "pushed:  $pushed"
            echo "checked: $checked"
            exit 1
          fi

      - name: Tag the verified image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          image: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ]
          docker buildx imagetools create "${args[@]}" "${image}@${DIGEST}"

      # Publish the release only once its image is pushed, so a failed image
      # build never leaves a public release without a matching image.
      - name: Generate MD5
        run: md5sum "bin/${APP_NAME}" > "bin/${APP_NAME}.md5"

      - name: Push to release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            bin/${{ env.APP_NAME }}
            bin/${{ env.APP_NAME }}.md5
          prerelease: ${{ steps.version.outputs.prerelease != '' }}
